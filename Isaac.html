<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#E1F5EE" />
<title>Isaac - AI Chat</title>
<style>
  :root {
    --bg: #F4FBF7;
    --surface: #FFFFFF;
    --surface-2: #FAFEFC;
    --sidebar: #E9F7F0;
    --line: #DDEFE6;
    --text: #04342C;
    --muted: #4A7A6C;
    --accent: #5DCAA5;
    --accent-strong: #1D9E75;
    --bot-bubble: #E1F5EE;
    --user-bubble: #1D9E75;
    --user-text: #FFFFFF;
    --chip: #FFFFFF;
    --skin: #F2C9A0;
    --hair: #2F3A36;
    --shadow: 0 8px 30px rgba(4, 52, 44, 0.08);
    --radius: 18px;
    --sidebar-w: 270px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1714;
      --surface: #121D19;
      --surface-2: #0F1916;
      --sidebar: #0B1411;
      --line: #213530;
      --text: #DDF3EA;
      --muted: #8DB5A7;
      --accent: #5DCAA5;
      --accent-strong: #3DB88E;
      --bot-bubble: #18302A;
      --user-bubble: #1D9E75;
      --chip: #16241F;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ============ INTRO ============ */
  .intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 24px;
    text-align: center;
    background: radial-gradient(circle at 50% 40%, var(--surface) 0%, var(--bg) 70%);
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .intro.hide { opacity: 0; visibility: hidden; }

  .intro-figure {
    width: min(220px, 55vw);
    animation: popIn 0.7s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  .intro-figure .arm {
    transform-box: view-box;
    transform-origin: 140px 168px;
    animation: wave 0.9s ease-in-out 0.6s 4 alternate both;
  }
  .intro-figure .eyes,
  .avatar .eyes {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 4s infinite;
  }
  .intro h1 {
    margin: 12px 0 0;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: -0.02em;
    animation: rise 0.6s ease 0.4s both;
  }
  .intro h1 span { color: var(--accent-strong); }
  .intro p {
    margin: 0;
    color: var(--muted);
    font-size: clamp(14px, 3.6vw, 16px);
    animation: rise 0.6s ease 0.6s both;
  }
  .intro-btn {
    margin-top: 22px;
    padding: 12px 26px;
    border: none;
    border-radius: 999px;
    background: var(--accent-strong);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    animation: rise 0.6s ease 0.9s both;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .intro-btn:hover { background: var(--accent); }
  .intro-btn:active { transform: scale(0.97); }

  @keyframes wave {
    0%   { transform: rotate(-8deg); }
    100% { transform: rotate(22deg); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(30px) scale(0.8); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }

  /* ============ APP LAYOUT ============ */
  .app {
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    height: 100vh;
    height: 100dvh;
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 16px 12px;
    padding-top: max(16px, env(safe-area-inset-top));
    min-height: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px 16px;
    font-weight: 700;
    font-size: 18px;
  }
  .new-chat {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: border-color 0.15s ease;
  }
  .new-chat:hover { border-color: var(--accent); }
  .history-label {
    margin: 20px 8px 8px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
  }
  .history {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-height: 0;
  }
  .history button {
    text-align: left;
    padding: 9px 12px;
    border: none;
    border-radius: 10px;
    background: transparent;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history button:hover { background: var(--bot-bubble); }
  .history button.active { background: var(--bot-bubble); font-weight: 600; }
  .sidebar-foot {
    padding: 12px 8px 0;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--line);
  }

  /* Main */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--surface-2);
  }
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 20px;
    padding-top: max(12px, env(safe-area-inset-top));
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    display: none;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 10px;
    background: transparent;
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--bot-bubble); }
  .icon-btn svg { width: 20px; height: 20px; }
  .who { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .who .name { margin: 0; font-weight: 600; font-size: 15px; }
  .who .status {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .who .status::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }

  .avatar {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #9FE1CB;
    overflow: hidden;
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .avatar.sm { width: 30px; height: 30px; }

  /* Thread */
  .scroller {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    scroll-behavior: smooth;
  }
  .thread {
    max-width: 780px;
    margin: 0 auto;
    padding: 28px 20px 12px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .msg {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    animation: rise 0.25s ease-out both;
  }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: min(78%, 620px);
    padding: 11px 15px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    border-bottom-left-radius: 5px;
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 5px;
  }
  .msg.error .bubble {
    background: #FDECEC;
    color: #8A1F1F;
  }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* Welcome / empty state */
  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 6vh 8px 8px;
    animation: rise 0.4s ease both;
  }
  .welcome .avatar { width: 72px; height: 72px; margin-bottom: 14px; }
  .welcome h2 { margin: 0 0 6px; font-size: clamp(22px, 5vw, 28px); letter-spacing: -0.01em; }
  .welcome p { margin: 0; color: var(--muted); font-size: 15px; }
  .chips {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    max-width: 560px;
    margin-top: 26px;
  }
  .chip {
    text-align: left;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--chip);
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
  .chip small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }

  /* Composer */
  .composer-wrap {
    padding: 10px 20px 16px;
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--surface-2) 70%, transparent);
  }
  .composer {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px 8px 8px 16px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    transition: border-color 0.15s ease;
  }
  .composer:focus-within { border-color: var(--accent); }
  .composer textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 16px; /* 16px stops iOS from zooming on focus */
    line-height: 1.45;
    padding: 8px 0;
    max-height: 180px;
  }
  .composer textarea::placeholder { color: var(--muted); }
  .send-btn {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent-strong);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, opacity 0.15s ease, transform 0.1s ease;
  }
  .send-btn svg { width: 18px; height: 18px; }
  .send-btn:hover { background: var(--accent); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .hint {
    max-width: 780px;
    margin: 8px auto 0;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }

  .backdrop { display: none; }

  /* ============ MOBILE ============ */
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    .sidebar {
      position: fixed;
      top: 0; bottom: 0; left: 0;
      width: min(82vw, 300px);
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }
    .app.nav-open .sidebar { transform: none; box-shadow: var(--shadow); }
    .backdrop {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(4, 30, 25, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .app.nav-open .backdrop { opacity: 1; pointer-events: auto; }
    .icon-btn { display: inline-flex; }
    .topbar { padding-left: 10px; padding-right: 10px; }
    .thread { padding: 18px 14px 8px; gap: 14px; }
    .bubble { max-width: 85%; font-size: 15px; }
    .msg .avatar.sm { display: none; }
    .composer-wrap { padding-left: 10px; padding-right: 10px; }
    .hint { display: none; }
  }
  @media (max-width: 480px) {
    .chips { grid-template-columns: 1fr; }
    .welcome { padding-top: 3vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- Reusable Isaac character (original drawing) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="isaac-base" viewBox="0 0 200 220">
      <!-- left arm (down) -->
      <path d="M62 172 Q48 196 50 220" stroke="#5DCAA5" stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- body / shirt -->
      <path d="M44 220 Q46 162 100 156 Q154 162 156 220 Z" fill="#5DCAA5"/>
      <path d="M86 157 L100 176 L114 157" fill="none" stroke="#1D9E75" stroke-width="4" stroke-linejoin="round"/>
      <!-- neck -->
      <rect x="90" y="134" width="20" height="24" rx="6" fill="#F2C9A0"/>
      <!-- ears -->
      <circle cx="58" cy="104" r="9" fill="#E9B98C"/>
      <circle cx="142" cy="104" r="9" fill="#E9B98C"/>
      <!-- head -->
      <circle cx="100" cy="100" r="42" fill="#F2C9A0"/>
      <!-- hair -->
      <path d="M58 100 Q52 50 100 48 Q150 48 142 100 Q138 76 120 70 Q104 82 78 74 Q64 82 58 100 Z" fill="#2F3A36"/>
      <!-- brows -->
      <path d="M78 92 Q86 87 94 91" stroke="#2F3A36" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M106 91 Q114 87 122 92" stroke="#2F3A36" stroke-width="3" stroke-linecap="round" fill="none"/>
      <!-- eyes -->
      <g class="eyes">
        <circle cx="86" cy="104" r="4.5" fill="#2F3A36"/>
        <circle cx="114" cy="104" r="4.5" fill="#2F3A36"/>
      </g>
      <!-- cheeks -->
      <ellipse cx="74" cy="118" rx="7" ry="4" fill="#F0A58E" opacity="0.55"/>
      <ellipse cx="126" cy="118" rx="7" ry="4" fill="#F0A58E" opacity="0.55"/>
      <!-- smile -->
      <path d="M86 120 Q100 134 114 120" stroke="#8C4A32" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </symbol>

  </defs>
</svg>

<!-- ============ INTRO ============ -->
<div class="intro" id="intro" role="dialog" aria-label="Welcome to Isaac">
  <svg class="intro-figure" viewBox="0 0 200 220" aria-hidden="true">
    <use href="#isaac-base"/>
    <!-- waving arm -->
    <g class="arm">
      <path d="M140 170 Q160 150 166 120" stroke="#5DCAA5" stroke-width="18" stroke-linecap="round" fill="none"/>
      <g fill="#F2C9A0">
        <rect x="155" y="88" width="7" height="18" rx="3.5"/>
        <rect x="162" y="84" width="7" height="20" rx="3.5"/>
        <rect x="169" y="86" width="7" height="19" rx="3.5"/>
        <rect x="176" y="91" width="6" height="16" rx="3"/>
        <ellipse cx="167" cy="110" rx="13" ry="12"/>
        <rect x="148" y="104" width="12" height="6" rx="3" transform="rotate(-30 154 107)"/>
      </g>
    </g>
  </svg>
  <h1>Hi, I'm <span>Isaac</span> 👋</h1>
  <p>Your friendly AI companion. Let's talk.</p>
  <button class="intro-btn" id="introBtn">Start chatting</button>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Chat history">
    <div class="brand">
      <div class="avatar"><svg viewBox="42 46 116 116"><use href="#isaac-base" width="200" height="220"/></svg></div>
      Isaac
    </div>
    <button class="new-chat" id="newChatBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="history-label">Recent</div>
    <nav class="history" id="history"></nav>
    <div class="sidebar-foot">Isaac · AI Chat</div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="who">
        <div class="avatar"><svg viewBox="42 46 116 116"><use href="#isaac-base" width="200" height="220"/></svg></div>
        <div>
          <p class="name">Isaac</p>
          <p class="status">Online · here to help</p>
        </div>
      </div>
      <button class="icon-btn" id="newChatTop" aria-label="New chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </header>

    <div class="scroller" id="scroller">
      <div class="thread" id="thread"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="msgInput" rows="1" placeholder="Message Isaac..." autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <p class="hint">Enter to send · Shift + Enter for a new line</p>
    </div>
  </main>
</div>

<script>
  // ---------- Config ----------
  const API_URL = "http://127.0.0.1:8000/isaac";

  // ---------- Elements ----------
  const app = document.getElementById('app');
  const intro = document.getElementById('intro');
  const thread = document.getElementById('thread');
  const scroller = document.getElementById('scroller');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const historyEl = document.getElementById('history');

  // ---------- Intro ----------
  let introTimer = setTimeout(closeIntro, 5200);
  function closeIntro() {
    clearTimeout(introTimer);
    intro.classList.add('hide');
    setTimeout(() => input.focus(), 400);
  }
  document.getElementById('introBtn').addEventListener('click', closeIntro);
  intro.addEventListener('click', (e) => { if (e.target === intro) closeIntro(); });
  document.addEventListener('keydown', (e) => {
    if (!intro.classList.contains('hide') && (e.key === 'Escape' || e.key === 'Enter')) {
      e.preventDefault();
      closeIntro();
    }
  });

  // ---------- Chat state (in memory) ----------
  let chats = [];
  let current = null;
  let busy = false;

  function newChat() {
    if (current && current.messages.length === 0) { render(); closeNav(); return; }
    current = { id: Date.now(), title: 'New chat', messages: [] };
    chats.unshift(current);
    render();
    closeNav();
    input.focus();
  }

  function selectChat(id) {
    current = chats.find(c => c.id === id);
    render();
    closeNav();
  }

  // ---------- Rendering ----------
  const avatarHTML = '<div class="avatar sm"><svg viewBox="42 46 116 116"><use href="#isaac-base" width="200" height="220"/></svg></div>';

  function render() {
    renderHistory();
    thread.innerHTML = '';
    if (!current.messages.length) {
      renderWelcome();
    } else {
      current.messages.forEach(m => thread.appendChild(buildMsg(m.text, m.role)));
    }
    scrollDown();
  }

  function renderHistory() {
    historyEl.innerHTML = '';
    chats.filter(c => c.messages.length).forEach(c => {
      const b = document.createElement('button');
      b.textContent = c.title;
      b.title = c.title;
      if (c === current) b.classList.add('active');
      b.addEventListener('click', () => selectChat(c.id));
      historyEl.appendChild(b);
    });
  }

  function renderWelcome() {
    const suggestions = [
      ['Help me plan my day', 'Organize my tasks'],
      ['Explain something simply', 'Like I\'m new to it'],
      ['I need some motivation', 'A quick pep talk'],
      ['Let\'s brainstorm ideas', 'For a side project'],
    ];
    const w = document.createElement('div');
    w.className = 'welcome';
    w.innerHTML = `
      <div class="avatar"><svg viewBox="42 46 116 116"><use href="#isaac-base" width="200" height="220"/></svg></div>
      <h2>How can I help today?</h2>
      <p>Take a breath — what's on your mind?</p>
      <div class="chips"></div>`;
    const chipsEl = w.querySelector('.chips');
    suggestions.forEach(([title, sub]) => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.innerHTML = `${title}<small>${sub}</small>`;
      c.addEventListener('click', () => { input.value = title; send(); });
      chipsEl.appendChild(c);
    });
    thread.appendChild(w);
  }

  function buildMsg(text, role) {
    const row = document.createElement('div');
    row.className = `msg ${role === 'user' ? 'user' : 'bot'}${role === 'error' ? ' error' : ''}`;
    if (role !== 'user') row.innerHTML = avatarHTML;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    return row;
  }

  function addMessage(text, role) {
    const welcome = thread.querySelector('.welcome');
    if (welcome) welcome.remove();
    current.messages.push({ text, role });
    thread.appendChild(buildMsg(text, role));
    scrollDown();
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg bot';
    row.id = 'typing';
    row.innerHTML = avatarHTML + '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    thread.appendChild(row);
    scrollDown();
  }
  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function scrollDown() {
    requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
  }

  // ---------- API ----------
  async function getBotReply(userMessage) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_input: userMessage })
    });
    if (!res.ok) throw new Error(`Server responded ${res.status}`);
    const raw = await res.text();

    // FastAPI often returns a JSON string ("...") or an object — unwrap either.
    try {
      const data = JSON.parse(raw);
      if (typeof data === 'string') return data;
      if (data && typeof data === 'object') {
        return data.reply ?? data.response ?? data.message ?? data.output ?? JSON.stringify(data);
      }
    } catch (_) { /* plain text */ }
    return raw;
  }

  // ---------- Send ----------
  async function send() {
    const value = input.value.trim();
    if (!value || busy) return;

    busy = true;
    if (current.messages.length === 0) {
      current.title = value.length > 40 ? value.slice(0, 40) + '…' : value;
    }
    addMessage(value, 'user');
    renderHistory();
    input.value = '';
    autoGrow();
    updateSendState();
    showTyping();

    try {
      const reply = await getBotReply(value);
      hideTyping();
      addMessage(reply, 'bot');
    } catch (err) {
      hideTyping();
      console.error(err);
      addMessage("Sorry, I couldn't reach my server just now. Please check that it's running and try again.", 'error');
    } finally {
      busy = false;
      updateSendState();
      input.focus();
    }
  }

  // ---------- Composer behavior ----------
  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 180) + 'px';
  }
  function updateSendState() {
    sendBtn.disabled = busy || !input.value.trim();
  }
  input.addEventListener('input', () => { autoGrow(); updateSendState(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);

  // ---------- Mobile sidebar ----------
  function openNav() { app.classList.add('nav-open'); }
  function closeNav() { app.classList.remove('nav-open'); }
  document.getElementById('menuBtn').addEventListener('click', openNav);
  document.getElementById('backdrop').addEventListener('click', closeNav);
  document.getElementById('newChatBtn').addEventListener('click', newChat);
  document.getElementById('newChatTop').addEventListener('click', newChat);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

  // ---------- Start ----------
  newChat();
</script>

</body>
</html>
